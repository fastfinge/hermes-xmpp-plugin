name: hermes-xmpp-plugin
label: XMPP/Jabber
kind: platform
version: 0.5.0
description: >
  Third-party XMPP/Jabber gateway platform plugin for Hermes Agent. Supports
  1:1 chat, MUC rooms, typing indicators, message reactions, threaded replies,
  data forms, ad-hoc commands, message markup, voice messages, mandatory
  STARTTLS, and XEP-0363 HTTP file upload.
author: Samuel Proulx / fastfinge, based on work by Eric Lars Lee and Mibay
requires_env:
  - name: XMPP_JID
    description: Bot JID, for example hermes@example.org
    prompt: XMPP bot JID
    password: false
  - name: XMPP_PASSWORD
    description: Bot account password
    prompt: XMPP bot password
    password: true
optional_env:
  - name: XMPP_HOST
    description: Optional host override when SRV lookup is not enough
    prompt: XMPP host override
    password: false
  - name: XMPP_PORT
    description: XMPP client port, defaults to 5222
    prompt: XMPP port
    password: false
  - name: XMPP_DIRECT_TLS
    description: Force direct TLS (XEP-0368) on/off; auto-enabled when XMPP_PORT is 5223
    prompt: Force direct TLS? true/false
    password: false
  - name: XMPP_CONNECT_TIMEOUT_SECS
    description: How long the background connect watchdog waits for the session to establish before giving up (default 180 seconds); does not block gateway startup. A blackholed IPv6 route can make a connection legitimately take ~130s+ before falling back to IPv4 — raise this further if connects still time out.
    prompt: Connect timeout in seconds
    password: false
  - name: XMPP_ALLOWED_USERS
    description: Comma-separated bare JIDs allowed to DM the bot
    prompt: Allowed user JIDs
    password: false
  - name: XMPP_ALLOW_ALL_USERS
    description: Set true only for development; allows any DM. MUC still requires verified allowed senders.
    prompt: Allow all users? true/false
    password: false
  - name: XMPP_MUC_ROOMS
    description: Comma-separated room@conference.example.org[/nick] values
    prompt: MUC rooms
    password: false
  - name: XMPP_MUC_NICK
    description: Default nickname in MUC rooms
    prompt: MUC nickname
    password: false
  - name: XMPP_HOME_CHANNEL
    description: Default JID or room for cron / send_message delivery
    prompt: XMPP home channel
    password: false
  - name: XMPP_OMEMO_ENABLED
    description: Enable OMEMO E2E encryption (requires slixmpp-omemo)
    prompt: Enable OMEMO? true/false
    password: false
  - name: XMPP_OMEMO_STORAGE_PATH
    description: Path to OMEMO device key JSON storage
    prompt: OMEMO storage path
    password: false
  - name: XMPP_MAX_MESSAGE_LENGTH
    description: Per-stanza body length cap in Unicode code-points (default 10000). Long messages are split into multiple stanzas.
    prompt: Max message length
    password: false
  - name: XMPP_MUC_ALLOWED_USERS
    description: Comma-separated personal bare JIDs permitted to invoke bot in configured rooms. Defaults to allowed_users; missing verified room identity always denied, even with allow_all_users.
    prompt: Allowed MUC senders
    password: false
  - name: XMPP_VOICE_TRANSCRIPTION
    description: Transcribe inbound voice notes (a message that is only one audio attachment) with Hermes' configured STT provider and use the transcript as the prompt (default true). Set false to receive ordinary HTTPS upload URLs as text; encrypted key-bearing links are still withheld.
    prompt: Transcribe voice notes? true/false
    password: false
  - name: XMPP_VOICE_TRUSTED_HOSTS
    description: Comma-separated upload hosts allowed to resolve to LAN/tailnet addresses when fetching voice notes (wildcards like *.example.org allowed). Default is the bot's own XMPP domain and its subdomains; set "none" to apply Hermes' SSRF policy to every host.
    prompt: Trusted voice upload hosts
    password: false
  - name: XMPP_CALLS_ENABLED
    description: Enable audio calls (Jingle RTP). Off by default; the first start with calls on installs the call packages (about 230 MB) into their own Hermes environment. The xmpp.calls.* config keys override it.
    prompt: Enable audio calls? true/false
    password: false
  - name: XMPP_PLAINTEXT_PEERS
    description: Comma-separated bare JIDs that never receive OMEMO-encrypted messages (opt-in; for trusted partner agents). Empty by default.
    prompt: Plaintext peer JIDs
    password: false
  - name: XMPP_AGENT_PEERS
    description: Comma-separated bare JIDs of partner agents. They may message the agent (rate limited) but can never call or be called.
    prompt: Partner agent JIDs
    password: false
provides_tools:
  - xmpp_call
  - xmpp_message
# Installed into the managed venv by `hermes pm install` / `hermes update`.
# aiohttp is left unpinned so it follows Hermes' own pin (>=3.14.1 for the CVE fixes).
# The audio call packages (requirements-calls.txt, about 230 MB) are not listed here: they are
# optional and get their own isolated Hermes environment when xmpp.calls.enabled is on.
pip_dependencies:
  - "slixmpp==1.15.0"
  - "aiohttp>=3.14.1"
  - "slixmpp-omemo"
  - "omemo"
