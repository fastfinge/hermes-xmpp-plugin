name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        # Deliberately no PYTHONPATH: the suite must pass in a standalone
        # plugin checkout (fake gateway/tools bootstrap in each test file).
        # If this goes red after a dep bump, check requirements*.txt pins
        # first — the suite historically rotted silently via missing dev
        # deps (52 dead async tests, unknown-mark warnings), so treat
        # warnings about unknown pytest marks as failures to investigate.
        run: python -m pytest tests/ -q
